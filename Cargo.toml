[package]
name = "needle"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["local", "documents"]
local = ["dep:fastembed"]
documents = ["dep:xberg", "dep:zip"]

[dependencies]
fastembed = { version = "5", optional = true }
xberg = { version = "=1.0.14", optional = true, default-features = false, features = ["chunking", "tokio-runtime", "pdf", "office", "html"] }
zip = { version = "8", optional = true, default-features = false, features = ["deflate-flate2"] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive", "env"] }
libsql = "0.9.30"
nucleo = "0.5.0"
notify = "8.0.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tantivy = "0.26"
thiserror = "2.0.18"
toml = "1.1.2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
fs2 = "0.4.3"
axum = "0.8.9"
maud = "0.27"
percent-encoding = "2.3"
usearch = "2"

[patch.crates-io]
xberg = { git = "https://github.com/Jawfish/xberg", rev = "2bc38b06a72a61f349639178166fc888677fb67e" }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
tests_outside_test_module = "deny"
